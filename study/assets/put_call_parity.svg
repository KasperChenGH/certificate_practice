<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" font-family="Arial, sans-serif">
  <!-- Axes -->
  <line x1="40" y1="200" x2="380" y2="200" stroke="#555" stroke-width="1.5"/>
  <line x1="40" y1="200" x2="40" y2="20" stroke="#555" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="210" y="240" text-anchor="middle" fill="#555" font-size="12">S&#x2009;(stock price at expiry)</text>
  <text x="15" y="110" text-anchor="middle" fill="#555" font-size="12" transform="rotate(-90,15,110)">Payoff at expiry</text>

  <!-- Grid lines -->
  <line x1="40" y1="120" x2="380" y2="120" stroke="#ddd" stroke-width="0.5"/>

  <!-- Dashed vertical at K -->
  <line x1="200" y1="20" x2="200" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Horizontal dashed line at K payoff level -->
  <line x1="40" y1="120" x2="200" y2="120" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Portfolio A: Call + Bond = max(S_T, K) -->
  <!-- Flat at K for S<K, then rises linearly -->
  <path d="M40,120 L200,120 L370,35" fill="none" stroke="#6ea1d8" stroke-width="2.5"/>

  <!-- Portfolio B: Put + Stock = max(S_T, K) -->
  <!-- Same shape, slightly offset to show overlap, then merge -->
  <path d="M40,120 L200,120 L370,35" fill="none" stroke="#e57373" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- Fill under the combined payoff -->
  <path d="M40,200 L40,120 L200,120 L370,35 L370,200 Z" fill="#6ea1d8" fill-opacity="0.1"/>

  <!-- K label on y-axis -->
  <text x="33" y="117" text-anchor="end" fill="#555" font-size="10">K</text>

  <!-- K label on x-axis -->
  <text x="200" y="215" text-anchor="middle" fill="#555" font-size="10">K</text>

  <!-- Labels for portfolios -->
  <rect x="215" y="55" width="170" height="50" rx="4" fill="none" stroke="#ddd" stroke-width="0.5"/>
  <line x1="222" y1="72" x2="245" y2="72" stroke="#6ea1d8" stroke-width="2.5"/>
  <text x="250" y="76" fill="#555" font-size="11">Call + Bond (A)</text>
  <line x1="222" y1="92" x2="245" y2="92" stroke="#e57373" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="250" y="96" fill="#555" font-size="11">Put + Stock (B)</text>

  <!-- Annotation -->
  <text x="120" y="155" text-anchor="middle" fill="#555" font-size="11" font-style="italic">Both pay max(S, K)</text>

  <!-- X-axis endpoints -->
  <text x="40" y="215" text-anchor="middle" fill="#555" font-size="10">0</text>
</svg>