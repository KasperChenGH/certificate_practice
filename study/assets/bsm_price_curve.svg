<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" font-family="Arial, sans-serif">
  <!-- Axes -->
  <line x1="40" y1="210" x2="380" y2="210" stroke="#555" stroke-width="1.5"/>
  <line x1="40" y1="210" x2="40" y2="15" stroke="#555" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="210" y="245" text-anchor="middle" fill="#555" font-size="12">Stock price S</text>
  <text x="15" y="110" text-anchor="middle" fill="#555" font-size="12" transform="rotate(-90,15,110)">Call price C</text>

  <!-- Grid lines -->
  <line x1="40" y1="150" x2="380" y2="150" stroke="#ddd" stroke-width="0.5"/>
  <line x1="40" y1="90" x2="380" y2="90" stroke="#ddd" stroke-width="0.5"/>
  <line x1="210" y1="15" x2="210" y2="210" stroke="#ddd" stroke-width="0.5"/>

  <!-- X-axis ticks -->
  <text x="40" y="225" text-anchor="middle" fill="#555" font-size="10">50</text>
  <text x="210" y="225" text-anchor="middle" fill="#555" font-size="10">100</text>
  <text x="380" y="225" text-anchor="middle" fill="#555" font-size="10">150</text>

  <!-- Y-axis ticks -->
  <text x="33" y="214" text-anchor="end" fill="#555" font-size="10">0</text>
  <text x="33" y="154" text-anchor="end" fill="#555" font-size="10">20</text>
  <text x="33" y="94" text-anchor="end" fill="#555" font-size="10">40</text>
  <text x="33" y="34" text-anchor="end" fill="#555" font-size="10">60</text>

  <!-- K=100 vertical dashed -->
  <line x1="210" y1="15" x2="210" y2="210" stroke="#555" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Intrinsic value: max(S-K,0) dashed line -->
  <!-- S from 50 to 100: flat at 0. S from 100 to 150: rises to 50 -->
  <path d="M40,210 L210,210 L380,50" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BSM price curve (smooth, always above intrinsic) -->
  <!-- At S=50: small positive (~1), rises smoothly, at S=100: ~12, at S=150: ~53 (just above intrinsic 50) -->
  <path d="M40,207 Q70,205 100,200 Q130,190 150,178 Q170,163 190,143 Q200,130 210,118 Q230,92 250,72 Q270,56 290,44 Q310,35 330,29 Q350,25 370,22 L380,21"
        fill="none" stroke="#6ea1d8" stroke-width="2.5"/>

  <!-- Time value double-arrow at S=120 (x=176) -->
  <!-- BSM price at S=120: ~22 => y=144. Intrinsic at S=120: 20 => y=150 -->
  <!-- Better: at S=110, BSM ~15 (y=165), intrinsic=10 (y=180) -->
  <!-- Use S=85 area where gap is visible: BSM ~5 (y=195), intrinsic=0 (y=210) -->
  <!-- Use S=90 (x=176): BSM ~7 (y=189), intrinsic=0 (y=210) -->
  <line x1="162" y1="187" x2="162" y2="210" stroke="#555" stroke-width="1"/>
  <polygon points="162,187 159,192 165,192" fill="#555"/>
  <polygon points="162,210 159,205 165,205" fill="#555"/>
  <text x="170" y="202" fill="#555" font-size="9" font-style="italic">time</text>
  <text x="170" y="212" fill="#555" font-size="9" font-style="italic">value</text>

  <!-- Labels -->
  <text x="340" y="18" fill="#6ea1d8" font-size="11" font-weight="bold">BSM price</text>
  <text x="320" y="72" fill="#555" font-size="11">Intrinsic value</text>

  <!-- K label -->
  <text x="215" y="28" fill="#555" font-size="10">K=100</text>
</svg>