<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" font-family="Arial, sans-serif">
  <!-- Axes -->
  <line x1="40" y1="210" x2="380" y2="210" stroke="#555" stroke-width="1.5"/>
  <line x1="40" y1="210" x2="40" y2="20" stroke="#555" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="210" y="245" text-anchor="middle" fill="#555" font-size="12">Strike K</text>
  <text x="15" y="115" text-anchor="middle" fill="#555" font-size="12" transform="rotate(-90,15,115)">Implied Volatility</text>

  <!-- Y-axis: 15% to 35%. Map: 15%=>210, 35%=>30 -->
  <!-- Each 1% = 9px -->

  <!-- Grid lines -->
  <line x1="40" y1="120" x2="380" y2="120" stroke="#ddd" stroke-width="0.5"/>
  <line x1="40" y1="165" x2="380" y2="165" stroke="#ddd" stroke-width="0.5"/>
  <line x1="40" y1="75" x2="380" y2="75" stroke="#ddd" stroke-width="0.5"/>

  <!-- X-axis ticks: 80 to 120, with 100 center -->
  <!-- Map: 80=>60, 90=>145, 100=>230, 110=>315, 120=>400 but clipped -->
  <!-- Adjusted: 80=>55, 90=>140, 100=>225, 110=>310, 120=>370 -->
  <text x="55" y="225" text-anchor="middle" fill="#555" font-size="10">80</text>
  <text x="134" y="225" text-anchor="middle" fill="#555" font-size="10">90</text>
  <text x="213" y="225" text-anchor="middle" fill="#555" font-size="10">100</text>
  <text x="292" y="225" text-anchor="middle" fill="#555" font-size="10">110</text>
  <text x="371" y="225" text-anchor="middle" fill="#555" font-size="10">120</text>

  <!-- Y-axis ticks -->
  <text x="33" y="214" text-anchor="end" fill="#555" font-size="10">15%</text>
  <text x="33" y="169" text-anchor="end" fill="#555" font-size="10">20%</text>
  <text x="33" y="124" text-anchor="end" fill="#555" font-size="10">25%</text>
  <text x="33" y="79" text-anchor="end" fill="#555" font-size="10">30%</text>
  <text x="33" y="34" text-anchor="end" fill="#555" font-size="10">35%</text>

  <!-- Vertical dashed line at ATM (K=100) -->
  <line x1="213" y1="20" x2="213" y2="210" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="220" y="32" fill="#555" font-size="9">ATM</text>

  <!-- Smile curve (U-shaped, symmetric, blue dashed) -->
  <!-- At K=80: ~30%, K=90: ~22%, K=100: ~20%, K=110: ~22%, K=120: ~30% -->
  <!-- y mapping: 30%=>75, 22%=>147, 20%=>165 -->
  <path d="M55,75 Q95,130 134,152 Q175,167 213,165 Q251,167 292,152 Q331,130 371,75"
        fill="none" stroke="#6ea1d8" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- Equity skew curve (tilted, higher on left, solid blue) -->
  <!-- At K=80: ~33%, K=90: ~26%, K=100: ~21%, K=110: ~19%, K=120: ~18% -->
  <!-- y mapping: 33%=>48, 26%=>111, 21%=>156, 19%=>174, 18%=>183 -->
  <path d="M55,48 Q95,90 134,120 Q175,150 213,156 Q251,168 292,174 Q331,180 371,183"
        fill="none" stroke="#6ea1d8" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="348" y="65" fill="#6ea1d8" font-size="11" font-style="italic">Smile</text>
  <text x="300" y="196" fill="#6ea1d8" font-size="11" font-weight="bold">Equity skew</text>
</svg>