<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" font-family="Arial, sans-serif">
  <!-- Axes -->
  <line x1="50" y1="210" x2="370" y2="210" stroke="#555" stroke-width="1.5"/>
  <line x1="50" y1="210" x2="50" y2="20" stroke="#555" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="210" y="245" text-anchor="middle" fill="#555" font-size="12">Stock price S</text>
  <text x="18" y="115" text-anchor="middle" fill="#555" font-size="12" transform="rotate(-90,18,115)">Delta</text>

  <!-- Grid lines -->
  <line x1="50" y1="115" x2="370" y2="115" stroke="#ddd" stroke-width="0.5"/>

  <!-- X-axis tick labels -->
  <text x="50" y="225" text-anchor="middle" fill="#555" font-size="10">60</text>
  <text x="130" y="225" text-anchor="middle" fill="#555" font-size="10">80</text>
  <text x="210" y="225" text-anchor="middle" fill="#555" font-size="10">100</text>
  <text x="290" y="225" text-anchor="middle" fill="#555" font-size="10">120</text>
  <text x="370" y="225" text-anchor="middle" fill="#555" font-size="10">140</text>

  <!-- Y-axis tick labels -->
  <text x="43" y="214" text-anchor="end" fill="#555" font-size="10">0</text>
  <text x="43" y="119" text-anchor="end" fill="#555" font-size="10">0.5</text>
  <text x="43" y="24" text-anchor="end" fill="#555" font-size="10">1.0</text>

  <!-- Horizontal dashed lines at 0, 0.5, 1 -->
  <line x1="50" y1="210" x2="370" y2="210" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="115" x2="370" y2="115" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="20" x2="370" y2="20" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Vertical dashed line at K=100 -->
  <line x1="210" y1="20" x2="210" y2="210" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Sigmoid delta curve -->
  <!-- S from 60 to 140, delta goes from ~0.01 to ~0.99 -->
  <!-- Using logistic-like shape centered at S=100 -->
  <path d="M50,208 Q70,207 90,205 Q110,201 125,195 Q140,185 155,170 Q170,150 185,130 Q195,118 210,115 Q225,108 240,80 Q250,65 260,52 Q275,40 290,32 Q310,26 330,23 Q350,21 370,20.5"
        fill="none" stroke="#6ea1d8" stroke-width="2.5"/>

  <!-- Region labels -->
  <text x="110" y="180" text-anchor="middle" fill="#555" font-size="12" font-weight="bold">OTM</text>
  <text x="210" y="100" text-anchor="middle" fill="#555" font-size="12" font-weight="bold">ATM</text>
  <text x="310" y="55" text-anchor="middle" fill="#555" font-size="12" font-weight="bold">ITM</text>
</svg>